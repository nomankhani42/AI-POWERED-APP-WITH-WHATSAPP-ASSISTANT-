name: voice-agent

services:
  agent:
    image: voice:latest        # built from ./Dockerfile, tagged for reuse
    restart: unless-stopped
    env_file:
      - .env                   # MONGODB_URI (Atlas SRV string) lives here
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"            # host 8000 -> agent 8000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - agent-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"            # host 6379 -> redis 6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

volumes:
  redis-data:

networks:
  agent-network:
    driver: bridge