[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice calling agent (Meta API + Deepgram STT/TTS + OpenAI Agents SDK; Cartesia rollback)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "openai-agents>=0.17.7",
    "redis>=8.0.1",
    "beanie>=2.1.0",
    "deepgram-sdk>=7.4.0",
    "cartesia>=3.3.0",
    "aiortc>=1.14.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=1.4.0",
    "fakeredis>=2.36.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
